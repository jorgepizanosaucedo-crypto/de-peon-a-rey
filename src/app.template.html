<title>De Peón a Rey</title>
<link rel="preload" href="fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
{{STYLES}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
{{PIECES}}
    <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.4 2.9 4.5 6.6 4.1c2.1-.2 3.9.9 5.4 2.8 1.5-1.9 3.3-3 5.4-2.8 3.7.4 5.7 4.3 4.2 7.6C19.5 16.4 12 21 12 21z"/></symbol>
    <symbol id="i-heart-o" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 19.6s-6.6-4.1-8.5-8.3C2.3 8.6 4 5.6 6.8 5.3c1.8-.2 3.4.9 5.2 3.2 1.8-2.3 3.4-3.4 5.2-3.2 2.8.3 4.5 3.3 3.3 6C18.6 15.5 12 19.6 12 19.6z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.6l2.9 6 6.5.9-4.7 4.6 1.1 6.5L12 17.5l-5.8 3.1 1.1-6.5L2.6 9.5l6.5-.9z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 17l5-6 4 3 5-8 4 5M3 21h18"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M5 20V11M10 20V5M15 20v-6M20 20V8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path fill="currentColor" d="M12 22c-4 0-7-2.8-7-6.6 0-3.5 2.4-5.4 3.6-8 .3.9.9 2.1 2 2.6C10.1 6.4 11.8 3.7 14.3 2c-.3 3 1.5 5 3 6.8 1.1 1.4 1.7 3 1.7 4.7C19 19 16 22 12 22z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></g><circle cx="12" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path fill="currentColor" d="M9 4h6l1.5 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5zm3 4.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm0 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-sound-on" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16 9.5a3.5 3.5 0 0 1 0 5M18.5 7a7 7 0 0 1 0 10"/></symbol>
    <symbol id="i-sound-off" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" d="M12 6.6C10.2 5.1 7.6 4.4 3.8 4.6v13.2c3.8-.2 6.4.5 8.2 2 1.8-1.5 4.4-2.2 8.2-2V4.6c-3.8-.2-6.4.5-8.2 2zM12 6.6v13.2"/></symbol>
    <symbol id="i-logo" viewBox="0 0 24 24"><path style="fill:var(--logo-crown,currentColor)" d="M8.6 6.6 8 2.4l2.3 1.9L12 1.8l1.7 2.5L16 2.4l-.6 4.2z"/><path fill="currentColor" d="M12 7.6a3 3 0 0 1 1.9 5.3h-3.8A3 3 0 0 1 12 7.6zM9.7 13.8h4.6c0 2.3 1.1 3.9 2 5.2H7.7c.9-1.3 2-2.9 2-5.2zM6.8 19.8h10.4a1 1 0 0 1 1 1v1.4H5.8v-1.4a1 1 0 0 1 1-1z"/></symbol>
  </defs>
</svg>

<div id="gate" class="gate-wrap"></div>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg><use href="#i-logo"/></svg></span><span>De Peón a Rey</span></div>
    <div class="chips" id="chips"></div>
  </header>

  <main>
    <section class="view" id="view-map" data-view="map"></section>
    <section class="view" id="view-school" data-view="school" hidden></section>
    <section class="view" id="view-lesson" data-view="lesson" hidden></section>
    <section class="view" id="view-analyze" data-view="analyze" hidden></section>
    <section class="view" id="view-progress" data-view="progress" hidden></section>
    <section class="view" id="view-play" data-view="play" hidden></section>
    <section class="view" id="view-duel" data-view="duel" hidden></section>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Secciones">
  <div class="tabbar-inner" role="tablist">
    <span class="tab-ind" aria-hidden="true"></span>
    <button class="tab" role="tab" data-tab="map" aria-selected="true"><svg aria-hidden="true"><use href="#i-map"/></svg>Mapa</button>
    <button class="tab" role="tab" data-tab="school" aria-selected="false"><svg aria-hidden="true"><use href="#i-book"/></svg>Escuela</button>
    <button class="tab" role="tab" data-tab="analyze" aria-selected="false"><svg aria-hidden="true"><use href="#i-scan"/></svg>Analizar</button>
    <button class="tab" role="tab" data-tab="progress" aria-selected="false"><svg aria-hidden="true"><use href="#i-chart"/></svg>Progreso</button>
  </div>
</nav>

<script type="application/json" id="puzzle-data">{{PUZZLES}}</script>
<script type="application/json" id="sample-game">{{SAMPLE}}</script>
<script src="vendor/chess.js"></script>
<script>
{{APPJS}}
</script>
